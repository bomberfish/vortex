[package]
name = "vortex"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
vortex-core = { path = "../core" }
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
raw-window-handle = "0.6"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "json"] }
serde_json = "1"
gpui-video-player = { path = "../video", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[features]
# In-app video playback (GStreamer). Without it, videos open in the browser.
default = ["video"]
video = ["dep:gpui-video-player"]
